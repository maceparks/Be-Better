<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BE A BETTER</title>
  
  <!-- Standalone Web App Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BE BETTER">
  <meta name="application-name" content="BE BETTER">
  <meta name="theme-color" content="#0c0e12">

  <!-- Dynamic PNG Elements for Phone Home Screen Badges -->
  <link id="dynamicFavicon" rel="icon" type="image/png">
  <link id="dynamicAppleIcon" rel="apple-touch-icon">
  <link id="dynamicManifest" rel="manifest">

  <script>
    // Generates a 512x512 PNG that mobile OS home screens render reliably
    (function generateAppIcon() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Rounded dark background
      const r = 110;
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(512 - r, 0);
      ctx.quadraticCurveTo(512, 0, 512, r);
      ctx.lineTo(512, 512 - r);
      ctx.quadraticCurveTo(512, 512, 512 - r, 512);
      ctx.lineTo(r, 512);
      ctx.quadraticCurveTo(0, 512, 0, 512 - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fillStyle = '#11151d';
      ctx.fill();

      // Border matching tactical accent
      ctx.lineWidth = 18;
      ctx.strokeStyle = '#22c55e';
      ctx.stroke();

      // Tactical grid lines
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(34, 197, 94, 0.12)';
      [128, 256, 384].forEach(pos => {
        ctx.beginPath();
        ctx.moveTo(pos, 30);
        ctx.lineTo(pos, 482);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(30, pos);
        ctx.lineTo(482, pos);
        ctx.stroke();
      });

      // Text: "BE"
      ctx.fillStyle = '#22c55e';
      ctx.font = '900 150px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('BE', 256, 210);

      // Text: "BETTER"
      ctx.fillStyle = '#f1f5f9';
      ctx.font = '900 96px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.fillText('BETTER', 256, 350);

      const pngData = canvas.toDataURL('image/png');

      document.getElementById('dynamicFavicon').href = pngData;
      document.getElementById('dynamicAppleIcon').href = pngData;

      const manifest = {
        name: "BE BETTER",
        short_name: "BE BETTER",
        start_url: "./index.html",
        display: "standalone",
        background_color: "#0c0e12",
        theme_color: "#0c0e12",
        icons: [{ src: pngData, sizes: "512x512", type: "image/png", purpose: "any maskable" }]
      };
      const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      document.getElementById('dynamicManifest').href = URL.createObjectURL(manifestBlob);
    })();
  </script>

  <style>
    :root {
      --accent: #22c55e;
      --accent-glow: rgba(34, 197, 94, 0.2);
      --accent-subtle: rgba(34, 197, 94, 0.1);
      --bg: #0c0e12;
      --surface: #13171f;
      --surface-hover: #181d27;
      --border: #242b3b;
      --border-strong: #333d52;
      --text: #f1f5f9;
      --text-muted: #8e9bb0;
      --text-dim: #546075;
      --danger: #ef4444;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      text-transform: uppercase !important;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 70px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 680px;
      padding: 16px 14px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .badge-icon {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 8px var(--accent-glow));
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--text);
      line-height: 1.1;
    }

    .brand-subtitle {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 38px;
      height: 38px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-icon:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
      color: var(--text);
    }

    .week-toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin
